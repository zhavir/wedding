name: Synchronize repository rulesets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/rulesets/*.json
      - .github/workflows/sync-rulesets.yml
      - scripts/sync_rulesets.sh
permissions:
  contents: read
concurrency:
  group: sync-rulesets
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synchronize authorized repository rulesets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/sync_rulesets.sh

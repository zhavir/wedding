
name: Cleanup AWS release logs

on:
  workflow_run:
    workflows:
      - Release to AWS
    types:
      - completed

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete successful release logs
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete release logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method DELETE \
            "/repos/${REPOSITORY}/actions/runs/${RUN_ID}/logs"

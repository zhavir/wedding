name: Pull request checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  PUBLIC_API_URL: /api
  SST_TELEMETRY_DISABLED: '1'
jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: '3.15'
      - run: uv sync --frozen --all-packages --all-groups
      - run: npm ci && npm --prefix frontend ci
      - run: uv run --frozen --package wedding-api prek run --all-files
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - run: node --test scripts/test_release_config.mjs
      - run: npx sst install && npx tsc -p tsconfig.infra.json
  tests:
    name: All tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: '3.15'
      - run: uv sync --frozen --all-packages --all-groups
      # Docker supplies ffmpeg, matching Python, PostgreSQL and offline Floci services.
      - run: docker compose --profile test run --build --rm unit
      - run: docker compose up --build -d --wait web
      - run: docker compose --profile test run --build --rm integration
      - run: docker compose run --rm api python scripts/check_migrations.py
      - run: docker compose --profile test run --build --rm browser
      - run: docker build --target lambda -f backend/Dockerfile -t wedding-lambda:check .
      - name: Clean up local test services
        if: always()
        run: docker compose --profile test down --volumes

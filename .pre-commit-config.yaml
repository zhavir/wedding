minimum_pre_commit_version: '3.2.0'
repos:
  - repo: local
    hooks:
      - id: monogram-png
        name: Generate monogram PNG
        entry: uv run --frozen --no-sync --package wedding-api python scripts/render_monogram.py
        language: system
        pass_filenames: false
        files: ^(frontend/static/monogram\.(svg|png)|scripts/render_monogram\.py)$
        priority: 90

      - id: pyproject-format
        name: pyproject.toml format
        entry: uv run --frozen --no-sync --package wedding-api pyproject-fmt
        language: system
        files: (^|/)pyproject\.toml$
        priority: 90

      - id: ruff-check
        name: Ruff lint (auto-fix including unsafe)
        entry: uv run --frozen --no-sync --package wedding-api ruff check --fix --unsafe-fixes
        language: system
        types_or: [python, pyi]
        priority: 90
      - id: ruff-format
        name: Ruff format (auto-fix)
        entry: uv run --frozen --no-sync --package wedding-api ruff format
        language: system
        types_or: [python, pyi]
        priority: 90
      - id: ty
        name: Python type check
        entry: uv run --frozen --no-sync --package wedding-api ty check
        language: system
        pass_filenames: false
        types_or: [python, pyi, toml]
        priority: 90
      - id: frontend-lint
        name: Frontend ESLint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
        priority: 90
      - id: frontend-format
        name: Frontend Prettier
        entry: npm --prefix frontend run format
        language: system
        pass_filenames: false
        files: ^frontend/
        priority: 90
      - id: frontend-types
        name: Svelte and TypeScript
        entry: npm --prefix frontend run check
        language: system
        pass_filenames: false
        files: ^frontend/
        priority: 90

  - repo: builtin
    hooks:
      - id: check-added-large-files
        exclude: uv.lock
        priority: 90
      - id: check-yaml
        types:
          - yaml
        priority: 90
      - id: end-of-file-fixer
        types:
          - text
        stages:
          - pre-commit
        priority: 90
      - id: trailing-whitespace
        priority: 90
      - id: check-case-conflict
        priority: 90
      - id: check-illegal-windows-names
        priority: 90
      - id: check-toml
        priority: 90
      - id: check-json
        priority: 90
      - id: mixed-line-ending
        exclude: \.ics$
        types:
          - text
        args: [--fix=lf]
        priority: 90

  - repo: meta
    hooks:
      - id: check-useless-excludes
        priority: 90

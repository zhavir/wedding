[project]
name = "wedding-workspace"
version = "0.1.0"
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = []

[tool.uv]
workspace.members = [ "backend" ]

[tool.ruff]
target-version = "py315"
line-length = 100
fix = true
unsafe-fixes = true
lint.select = [ "B", "E", "F", "I", "SIM", "UP" ]
lint.ignore = [ "E501" ]
lint.per-file-ignores."backend/tests/*" = [ "E402" ]
lint.per-file-ignores."scripts/init_aws.py" = [ "E402" ]
lint.fixable = [ "ALL" ]

[tool.ty]
src.include = [
  "backend/app",
  "backend/tests",
  "scripts",
  "tests/integration.py",
]
environment.extra-paths = [ "backend" ]
environment.python-version = "3.15"

<!doctype html>
<html lang="{{ language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ copy.subject }}</title>
<style>@media(max-width:600px){.card{padding:28px 20px!important}h1{font-size:34px!important}}</style></head>
<body style="margin:0;background:#f7f5ef;color:#354b3d;font-family:Arial,sans-serif">
<table role="presentation" style="width:100%;border-collapse:collapse"><tr><td align="center" style="padding:24px 12px"><table role="presentation" style="width:100%;max-width:600px;background:#fff;border-collapse:collapse"><tr><td class="card" style="padding:44px 36px;text-align:center">
<p style="font-size:16px;letter-spacing:2px">{{ copy.eyebrow }}</p>
<h1 style="font:42px Georgia,serif;line-height:1.2">{{ w.names | join(' & ') }}</h1>
<p style="font-size:18px;line-height:1.7">{{ guest.name }}, {{ intro }}</p>
<p style="font-size:22px;line-height:1.6">{{ w.dateLabel }}<br>{{ w.venue }}</p>
<p style="font-size:18px;line-height:1.7">{{ w.address }}</p>
<p style="font-size:18px;line-height:1.7">{{ copy.calendarHelp }}</p>
<a href="{{ site_url }}" style="display:inline-block;background:#354b3d;color:#fff;padding:16px 24px;font-size:18px;text-decoration:none">{{ copy.button }} →</a>
</td></tr></table></td></tr></table></body></html>

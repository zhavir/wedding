[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.1,<0.14" ]

[project]
name = "wedding-api"
version = "0.1.0"
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "alembic>=1.20",
  "asyncpg>=0.32",
  "aurora-dsql-python-connector>=0.2.7",
  "aurora-dsql-sqlalchemy>=1.3",
  "boto3>=1.43.114",
  "cryptography>=50.0.2",
  "email-validator>=2.3",
  "fastapi>=0.143.5",
  "itsdangerous>=2.2",
  "jinja2>=3.1.6",
  "pillow>=13",
  "pillow-heif>=1.8.1",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16",
  "pyotp>=2.10",
  "python-multipart>=0.0.32",
  "qrcode>=8.2",
  "sqladmin>=0.32",
  "sqlalchemy[asyncio]>=2.1.5",
  "uvicorn>=0.54",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "boto3-stubs[dsql,s3,ses]>=1.43.114",
  "cairosvg>=2.9.1",
  "httpx2>=2.13.1",
  "prek>=0.5.5",
  "pyproject-fmt>=2.30.3",
  "pytest>=9.1.1",
  "pyyaml>=6.0.3",
  "ruff>=0.17.1",
  "ty>=0.0.89",
]

[tool.uv]
build-backend.module-name = "app"
build-backend.module-root = ""
